<!DOCTYPE html>
<html lang="pt-br" class="scroll-pt-8">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>[Seu Nome], Ph.D. | Portfólio</title>
    <script src="https://tailwindcss.com"></script>
    <link href="https://googleapis.com" rel="stylesheet">
    <style> body { font-family: 'DM Sans', sans-serif; } </style>
</head>
<body class="bg-[#0b1311] text-white min-h-screen flex flex-col justify-between antialiased">
    <main class="flex-grow flex items-center justify-center px-6 py-16 md:py-24 bg-[radial-gradient(circle_at_top_left,_var(--tw-gradient-stops))] from-[#132c23] via-[#09110e] to-[#050807]">
        <div class="max-w-5xl w-full flex flex-col md:flex-row items-start gap-12 md:gap-16">
            <div class="w-full md:w-1/3 flex flex-col items-center md:items-start text-center md:text-left space-y-6 sticky top-8">
                <img class="w-36 h-36 md:w-44 md:h-44 rounded-full object-cover border-2 border-emerald-800/20 shadow-2xl" src="https://unsplash.com" alt="Sua Foto de Perfil">
                <div class="space-y-2">
                    <h1 class="text-3xl md:text-4xl font-bold tracking-tight text-gray-100">[Seu Nome], Ph.D.</h1>
                    <p class="text-base text-gray-400 font-medium leading-relaxed">[Seu Cargo Atual]</p>
                </div>
            </div>
            <div class="w-full md:w-2/3 space-y-10">
                <section class="space-y-4">
                    <h2 class="text-xs font-semibold uppercase tracking-widest text-emerald-500/80 border-b border-emerald-950/40 pb-2">Conteúdo & Seções</h2>
                    <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
                        <a href="#sobre" class="group flex items-center justify-between p-4 rounded-xl bg-emerald-950/10 border border-emerald-900/10 hover:border-emerald-500/30 hover:bg-emerald-950/20 transition-all duration-200">
                            <span class="text-sm font-medium text-gray-300 group-hover:text-emerald-400">Sobre mim</span>
                            <span class="text-gray-600 group-hover:text-emerald-500 text-xs">→</span>
                        </a>
                        <a href="#publicacoes" class="group flex items-center justify-between p-4 rounded-xl bg-emerald-950/10 border border-emerald-900/10 hover:border-emerald-500/30 hover:bg-emerald-950/20 transition-all duration-200">
                            <span class="text-sm font-medium text-gray-300 group-hover:text-emerald-400">Publicações Acadêmicas</span>
                            <span class="text-gray-600 group-hover:text-emerald-500 text-xs">→</span>
                        </a>
                    </div>
                </section>
            </div>
        </div>
    </main>
    <footer class="w-full py-6 px-8 flex justify-end bg-[#050807] border-t border-emerald-950/20 text-xs text-gray-500 tracking-wide">
        <span>Built with Faculty</span>
    </footer>
</body>
</html>
